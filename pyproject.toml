[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-toolbox"
version = "0.0.1"
description = "Personal Python utility library: scraping, strings, IO, datetime, and other general-purpose helpers."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Vegard Haugland", email = "hauglandvegard@gmail.com" },
]
keywords = ["utilities", "toolbox", "scraping", "strings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/hauglandvegard/python-toolbox"
Repository = "https://github.com/hauglandvegard/python-toolbox"
Issues = "https://github.com/hauglandvegard/python-toolbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbox"]

[tool.hatch.build.targets.sdist]
include = [
    "src/toolbox",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["toolbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
